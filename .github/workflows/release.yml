name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome ZIP
        run: npm run zip

      - name: Build Firefox ZIP
        run: npm run zip:firefox

      - name: Rename Firefox ZIP to XPI
        run: |
          for f in .output/*-firefox.zip; do
            mv "$f" "${f%-firefox.zip}-firefox.xpi"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*-chrome.zip
            .output/*-firefox.xpi
          generate_release_notes: true
