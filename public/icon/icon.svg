<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 背景 -->
  <rect width="128" height="128" rx="24" fill="#059669"/>
  <!-- 左のリンク -->
  <rect x="8" y="38" width="74" height="42" rx="21" fill="none" stroke="white" stroke-width="12"/>
  <!-- 右のリンク -->
  <rect x="46" y="48" width="74" height="42" rx="21" fill="#059669" stroke="white" stroke-width="12"/>
  <!-- 重なり部分の中を塗る（右リンクの内側） -->
  <rect x="58" y="60" width="50" height="18" rx="9" fill="#059669"/>
  <!-- 左リンクの中を塗る（重なり部分） -->
  <rect x="20" y="50" width="50" height="18" rx="9" fill="#059669"/>
</svg>
